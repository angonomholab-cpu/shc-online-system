<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHC Online System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f7; }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .apple-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        .marquee-container { overflow: hidden; white-space: nowrap; }
        .marquee-content { display: inline-block; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body class="h-screen flex flex-col text-gray-800 overflow-hidden">

    <div class="bg-red-500 text-white text-sm font-medium py-2 px-4 marquee-container glassmorphism relative z-20">
        <div class="marquee-content">
            ⚠️ Alert: Patient SHC-A7B9X2 (ART) is Overdue! | 🟡 Alert: Patient SHC-X9M2L1 (PrEP) is Near Due (3 days left).
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden p-4 gap-4">
        
        <div class="w-1/3 bg-white rounded-3xl apple-shadow p-6 overflow-y-auto hidden md:block">
            <h2 class="text-xl font-semibold mb-4 text-gray-900">Patient Data Entry</h2>
            <form class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Full Name</label>
                    <input type="text" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Birthday</label>
                        <input type="date" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Sex</label>
                        <select class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option>Male</option><option>Female</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Address</label>
                    <input type="text" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">UIC Patient Code</label>
                    <input type="text" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-2">Category</label>
                    <div class="flex flex-wrap gap-2">
                        <span class="px-3 py-1 bg-blue-100 text-blue-700 text-xs rounded-full font-medium cursor-pointer border border-blue-200">MSM</span>
                        <span class="px-3 py-1 bg-gray-100 text-gray-600 text-xs rounded-full font-medium cursor-pointer">TGW</span>
                        <span class="px-3 py-1 bg-gray-100 text-gray-600 text-xs rounded-full font-medium cursor-pointer">FSW</span>
                        <span class="px-3 py-1 bg-gray-100 text-gray-600 text-xs rounded-full font-medium cursor-pointer">PWID</span>
                    </div>
                </div>
                <hr class="my-4 border-gray-100">
                <button type="button" class="w-full bg-blue-600 text-white rounded-xl py-3 font-semibold hover:bg-blue-700 transition shadow-md">
                    Enroll Patient & Generate QR
                </button>
            </form>
        </div>

        <div class="w-full md:w-2/3 flex flex-col gap-4 relative">
            
            <div class="bg-white rounded-full apple-shadow px-6 py-3 flex justify-between items-center z-10">
                <div class="flex gap-4 font-medium text-sm">
                    <button class="text-blue-600 border-b-2 border-blue-600 pb-1">Patients</button>
                    <button class="text-gray-400 hover:text-gray-600 pb-1">Inventory</button>
                </div>
                <select class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-1 text-sm outline-none">
                    <option>All Services</option>
                    <option>PREP Enrollment</option>
                    <option>ART Enrollment</option>
                </select>
            </div>

            <div class="flex-1 overflow-y-auto space-y-4 pb-24">
                
                <div class="bg-white rounded-3xl apple-shadow p-6 transition-all border border-gray-100">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-xl">👤</div>
                            <div>
                                <h3 class="font-bold text-lg text-gray-900 flex items-center gap-2">
                                    Juan Dela Cruz <span class="w-2 h-2 rounded-full bg-green-500"></span>
                                </h3>
                                <p class="text-xs text-gray-500">SHC-A7B9X2 • ART Enrollment</p>
                            </div>
                        </div>
                        <button class="text-gray-400 hover:text-gray-700"><i class="fa-solid fa-qrcode text-xl"></i></button>
                    </div>

                    <div class="border-b border-gray-100 flex gap-4 mb-4 text-sm font-medium">
                        <button class="pb-2 border-b-2 border-blue-600 text-blue-600">DOH E-Forms</button>
                        <button class="pb-2 text-gray-500">Lab & Baseline</button>
                        <button class="pb-2 text-gray-500">Treatment & Refill</button>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="bg-gray-50 p-4 rounded-xl">
                            <h4 class="text-xs font-bold text-gray-700 uppercase tracking-wide mb-3">DOH Standardized E-Forms</h4>
                            <div class="space-y-2 text-sm">
                                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-blue-600"> Informed Consent</label>
                                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-blue-600"> Form A (HIV Testing)</label>
                                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="rounded text-blue-600"> Form BC (Care Report)</label>
                                <button class="mt-2 text-xs bg-white border border-gray-200 px-3 py-1 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-upload"></i> Upload Document</button>
                            </div>
                        </div>

                        <div class="bg-gray-50 p-4 rounded-xl">
                            <h4 class="text-xs font-bold text-gray-700 uppercase tracking-wide mb-3">Pre-Treatment Baseline Tests</h4>
                            <div class="space-y-2 text-sm">
                                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="rounded text-blue-600"> CBC</label>
                                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="rounded text-blue-600"> Serum Creatinine</label>
                                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="rounded text-blue-600"> Liver Function Tests (LFT)</label>
                                <div class="mt-3 pt-3 border-t border-gray-200">
                                    <span class="text-xs font-semibold text-gray-600 block mb-1">External Referrals (CMV)</span>
                                    <button class="text-xs bg-white border border-gray-200 px-3 py-1 rounded-lg text-gray-600 hover:bg-gray-100 w-full text-left"><i class="fa-solid fa-camera"></i> Upload Doctor's Rx</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 p-4 bg-blue-50/50 border border-blue-100 rounded-xl">
                        <h4 class="text-sm font-bold text-gray-800 mb-3 flex items-center gap-2"><i class="fa-solid fa-pills text-blue-600"></i> Dispense Medication</h4>
                        <div class="grid grid-cols-3 gap-4 items-end">
                            <div class="col-span-2">
                                <label class="block text-xs font-medium text-gray-600 mb-1">Dispensed By / Given By</label>
                                <input type="text" placeholder="Nurse Name..." class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-400">
                            </div>
                            <div class="col-span-1">
                                <label class="block text-xs font-medium text-gray-600 mb-1">Quantity (pcs)</label>
                                <input type="number" class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none">
                            </div>
                        </div>
                        <div class="mt-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Other Services (Counseling, etc.)</label>
                            <input type="text" class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none mb-3">
                        </div>
                        <button class="w-full bg-gray-900 text-white rounded-lg py-2 text-sm font-semibold hover:bg-gray-800 transition flex items-center justify-center gap-2 shadow-sm">
                            <i class="fa-solid fa-barcode"></i> Scan Meds to Auto-Deduct Inventory
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 glassmorphism apple-shadow rounded-full px-6 py-3 flex gap-8 items-center z-50">
        <button class="text-gray-400 hover:text-blue-600 transition flex flex-col items-center gap-1">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-medium">Home</span>
        </button>
        <button class="bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center apple-shadow hover:bg-blue-700 transition transform -translate-y-4">
            <i class="fa-solid fa-qrcode text-2xl"></i>
        </button>
        <button class="text-gray-400 hover:text-blue-600 transition flex flex-col items-center gap-1">
            <i class="fa-solid fa-boxes-stacked text-lg"></i>
            <span class="text-[10px] font-medium">Stock</span>
        </button>
    </div>

</body>
</html>
