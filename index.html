<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHC Online System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for an Apple-like feel */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden text-gray-800">

    <div class="bg-red-50 text-red-600 text-sm font-medium py-2 px-4 shadow-sm z-10 flex overflow-hidden">
        <div class="whitespace-nowrap animate-[marquee_15s_linear_infinite]">
            ⚠️ <span class="font-bold">Overdue:</span> Juan Dela Cruz (ART) - 2 days late &nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp; 
            🟡 <span class="font-bold">Near Due:</span> Maria Clara (PrEP) - Due in 3 days
        </div>
    </div>

    <div class="flex flex-1 p-6 gap-6 overflow-hidden">
        
        <div class="w-1/3 bg-white rounded-3xl shadow-sm p-6 overflow-y-auto border border-gray-100">
            <h2 class="text-2xl font-semibold mb-6 tracking-tight">New Patient Enrollment</h2>
            
            <form class="space-y-4 text-sm">
                <div>
                    <label class="block text-gray-500 mb-1">Full Name</label>
                    <input type="text" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="e.g. Juan Dela Cruz">
                </div>
                
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-gray-500 mb-1">Birthday</label>
                        <input type="date" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-gray-500 mb-1">Sex</label>
                        <select class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-500 mb-1">Category</label>
                    <div class="flex flex-wrap gap-2 mt-1">
                        <button type="button" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium border border-blue-200">MSM</button>
                        <button type="button" class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-medium hover:bg-gray-200 transition">TGW</button>
                        <button type="button" class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-medium hover:bg-gray-200 transition">FSW</button>
                        <button type="button" class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-medium hover:bg-gray-200 transition">PWID</button>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-500 mb-2 mt-4">Services Offered</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2 rounded-xl border border-indigo-100 transition font-medium">PREP Enrollment</button>
                        <button type="button" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 py-2 rounded-xl border border-emerald-100 transition font-medium">ART Enrollment</button>
                        <button type="button" class="bg-rose-50 hover:bg-rose-100 text-rose-700 py-2 rounded-xl border border-rose-100 transition font-medium">Syphilis Treatment</button>
                        <button type="button" class="bg-amber-50 hover:bg-amber-100 text-amber-700 py-2 rounded-xl border border-amber-100 transition font-medium">Gonorrhea Treatment</button>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl mt-6 shadow-md transition">
                    Generate Patient Record & QR
                </button>
            </form>
        </div>

        <div class="w-2/3 bg-transparent flex flex-col">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold tracking-tight">Enrolled Patients</h2>
                <select class="bg-white border border-gray-200 rounded-xl px-4 py-2 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option>All Services</option>
                    <option>ART Patients</option>
                    <option>PrEP Patients</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4 overflow-y-auto pb-24">
                
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer relative group">
                    <div class="flex items-center gap-4">
                        <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Juan" alt="Avatar" class="w-14 h-14 bg-gray-50 rounded-full border border-gray-200">
                        <div>
                            <h3 class="font-semibold text-lg">Juan Dela Cruz</h3>
                            <p class="text-xs text-gray-500">UIC: SHC-A7B9X2</p>
                            <span class="inline-block mt-1 px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-md text-xs font-medium">ART Enrollment</span>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-50 flex justify-between items-center">
                        <div class="text-xs text-gray-500">
                            Next Due: <span class="font-semibold text-gray-800">Oct 25, 2026</span>
                        </div>
                        <div class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer relative group">
                    <div class="flex items-center gap-4">
                        <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Maria" alt="Avatar" class="w-14 h-14 bg-gray-50 rounded-full border border-gray-200">
                        <div>
                            <h3 class="font-semibold text-lg">Maria Clara</h3>
                            <p class="text-xs text-gray-500">UIC: SHC-M4C1X9</p>
                            <span class="inline-block mt-1 px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded-md text-xs font-medium">PREP Enrollment</span>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-50 flex justify-between items-center">
                        <div class="text-xs text-gray-500">
                            Next Due: <span class="font-semibold text-gray-800">May 12, 2026</span>
                        </div>
                        <div class="w-3 h-3 rounded-full bg-yellow-400 shadow-[0_0_8px_rgba(250,204,21,0.6)]"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 glass-panel rounded-full px-6 py-3 shadow-lg flex items-center gap-8 z-20">
        <button class="flex flex-col items-center text-gray-500 hover:text-blue-600 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24
